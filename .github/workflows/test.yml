name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build auth-service with Maven
        run: |
          cd auth-service
          mvn clean package -DskipTests
          cd ..

      - name: Build account-service with Maven
        run: |
          cd account-service
          mvn clean package -DskipTests
          cd ..

      - name: Build api-gateway with Maven
        run: |
          cd api-gateway
          mvn clean package -DskipTests
          cd ..

      - name: Verify JAR files exist
        run: |
          ls -la auth-service/target/*.jar
          ls -la account-service/target/*.jar
          ls -la api-gateway/target/*.jar

      - name: Build Docker images
        run: |
          docker build -t auth-service ./auth-service
          docker build -t account-service ./account-service
          docker build -t api-gateway ./api-gateway
          docker build -t frontend ./frontend

      - name: Start services with Docker Compose
        run: docker compose up -d

      - name: Wait for services to be ready
        run: |
          sleep 30
          echo "Waiting for auth-service..."
          curl --retry 10 --retry-delay 5 --fail http://localhost:8080/api/auth/login -X POST -H "Content-Type: application/json" -d '{"email":"testauto@mail.com","password":"123456"}' || true

      - name: Run API tests
        run: |
          cd aqa-tests
          mvn clean test
          cd ..

      - name: Generate Allure Report
        if: always()
        run: |
          cd aqa-tests
          mvn allure:report
          cd ..
          mkdir -p allure-report
          cp -r aqa-tests/target/site/allure-maven-plugin/* allure-report/ || true

      - name: Upload Allure Report as Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report
          retention-days: 7

  deploy-report:
    needs: build-and-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Allure Report artifact
        uses: actions/download-artifact@v4
        with:
          name: allure-report
          path: ./allure-report

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./allure-report
          destination_dir: ./allure-report