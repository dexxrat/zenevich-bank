name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:  # позволяет запускать вручную

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_AUTH: ${{ github.repository }}/auth-service
  IMAGE_NAME_ACCOUNT: ${{ github.repository }}/account-service

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build microservices with Maven
        run: |
          mvn -f auth-service/pom.xml clean package -DskipTests
          mvn -f account-service/pom.xml clean package -DskipTests

      - name: Build Docker images
        run: |
          docker build -t auth-service ./auth-service
          docker build -t account-service ./account-service

      - name: Start services with Docker Compose
        run: docker-compose up -d

      - name: Wait for services to be ready
        run: |
          sleep 20
          curl --retry 10 --retry-delay 5 --fail http://localhost:8081/actuator/health
          curl --retry 10 --retry-delay 5 --fail http://localhost:8082/actuator/health

      - name: Run API tests
        run: mvn -f aqa-tests/pom.xml clean test

      - name: Generate Allure Report
        if: always()
        run: |
          mvn -f aqa-tests/pom.xml allure:report
          mv aqa-tests/target/site/allure-maven-plugin ./allure-report

      - name: Upload Allure Report as Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: ./allure-report
          retention-days: 7

  deploy-report:
    needs: build-and-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Allure Report artifact
        uses: actions/download-artifact@v4
        with:
          name: allure-report
          path: ./allure-report

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./allure-report
          destination_dir: ./allure-report