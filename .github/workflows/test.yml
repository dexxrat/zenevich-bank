name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build all services with Maven
        run: |
          cd auth-service && mvn clean package -DskipTests && cd ..
          cd account-service && mvn clean package -DskipTests && cd ..
          cd api-gateway && mvn clean package -DskipTests && cd ..

      - name: Verify JAR files
        run: |
          ls -la auth-service/target/*.jar
          ls -la account-service/target/*.jar
          ls -la api-gateway/target/*.jar

      - name: Build Docker images
        run: |
          docker build -t auth-service ./auth-service
          docker build -t account-service ./account-service
          docker build -t api-gateway ./api-gateway
          docker build -t frontend ./frontend

      - name: Create network
        run: docker network create bank-network || true

      - name: Start databases
        run: |
          docker run -d --name auth-db --network bank-network -p 5434:5432 -e POSTGRES_DB=authdb -e POSTGRES_USER=bank -e POSTGRES_PASSWORD=bankpass postgres:16
          docker run -d --name account-db --network bank-network -p 5435:5432 -e POSTGRES_DB=accountdb -e POSTGRES_USER=bank -e POSTGRES_PASSWORD=bankpass postgres:16
          sleep 10

      - name: Start services
        run: |
          docker run -d --name auth-service --network bank-network -p 8081:8081 -e SPRING_DATASOURCE_URL=jdbc:postgresql://auth-db:5432/authdb -e SPRING_DATASOURCE_USERNAME=bank -e SPRING_DATASOURCE_PASSWORD=bankpass auth-service
          docker run -d --name account-service --network bank-network -p 8082:8082 -e SPRING_DATASOURCE_URL=jdbc:postgresql://account-db:5432/accountdb -e SPRING_DATASOURCE_USERNAME=bank -e SPRING_DATASOURCE_PASSWORD=bankpass account-service
          docker run -d --name api-gateway --network bank-network -p 8080:8080 api-gateway
          sleep 20

      - name: Check services health
        run: |
          echo "Checking auth-service..."
          curl --retry 10 --retry-delay 5 --fail http://localhost:8080/api/auth/login -X POST -H "Content-Type: application/json" -d '{"email":"testauto@mail.com","password":"123456"}' || true
          echo "Services started"

      - name: Run API tests
        run: |
          cd aqa-tests
          mvn clean test
          cd ..

      - name: Generate Allure Report
        if: always()
        run: |
          cd aqa-tests
          mvn allure:report
          cd ..
          mkdir -p allure-report
          cp -r aqa-tests/target/site/allure-maven-plugin/* allure-report/ || true

      - name: Upload Allure Report as Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report
          retention-days: 7

  deploy-report:
    needs: build-and-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Allure Report artifact
        uses: actions/download-artifact@v4
        with:
          name: allure-report
          path: ./allure-report

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./allure-report
          destination_dir: ./allure-report